
name: Build Xmoon IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Xmoon source
        run: |
          rm -rf Xmoon
          unzip -q Xmoon-v1.1-Full.zip

      - name: Build Xmoon
        run: |
          set -euo pipefail
          xcodebuild \
            -project Xmoon/Xmoon.xcodeproj \
            -scheme Xmoon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload Xmoon.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Xmoon-IPA-v1.1
          path: Xmoon.ipa
